<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Project: Ringo Market</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        var saved = localStorage.getItem('ringo_theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <form id="login" hidden>
      <div class="tools">
        <div class="lang" id="login-lang"></div>
        <div id="login-theme"></div>
      </div>
      <span id="login-logo"></span>
      <p class="eyebrow" id="login-kicker"></p>
      <h1 id="login-title" class="wordmark"></h1>
      <p id="login-help"></p>
      <input name="token" type="password" autocomplete="current-password" required />
      <button type="submit" id="login-submit"></button>
      <p id="login-error"></p>
    </form>
    <div id="shell" hidden>
    <aside id="clips"></aside>
    <button type="button" id="clips-backdrop"></button>
    <main id="app">
      <header>
        <div class="brand">
          <div class="channel">
            <h1 id="title" class="wordmark"></h1>
            <p id="updated"></p>
          </div>
        </div>
        <div class="header-side">
          <div class="people">
            <p id="people-label" class="people-label"></p>
            <ul id="members" class="members"></ul>
          </div>
          <div class="tools">
            <button type="button" id="clips-toggle"></button>
            <div class="lang" id="lang"></div>
            <div id="theme"></div>
            <button type="button" id="logout"></button>
          </div>
          <p id="recorder"></p>
        </div>
        <div class="project-facts">
          <p class="due-line">
            <span id="due-label" class="due-label"></span>
            <span id="due-clock"></span>
            <span id="due-left"></span>
            <span id="due-when"></span>
          </p>
          <dl class="budget">
            <div>
              <dt id="budget-label"></dt>
              <dd id="budget-amount"></dd>
            </div>
            <div>
              <dt id="budget-used-label"></dt>
              <dd id="budget-used"></dd>
            </div>
            <div>
              <dt id="budget-span-label"></dt>
              <dd id="budget-span"></dd>
            </div>
          </dl>
        </div>
      </header>
      <nav id="workspace" class="workspace-tabs" role="tablist"></nav>
      <p id="workspace-hint" class="workspace-hint"></p>
      <section id="attached" hidden></section>
      <section id="cards"></section>
      <section id="legend"></section>
      <section class="split">
        <div class="panel">
          <h2 id="chart-title"></h2>
          <div id="chart"></div>
        </div>
        <div class="panel">
          <h2 id="feed-title"></h2>
          <p id="feed-help"></p>
          <ol id="feed"></ol>
        </div>
      </section>
      <section id="breakdowns"></section>
      <section id="organizations"></section>
      <section id="stack"></section>
      <section id="plan"></section>
      <footer id="footer"></footer>
    </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
