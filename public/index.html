<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ringo Market</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function () {
        var saved = localStorage.getItem('ringo_theme')
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <form id="login" hidden>
      <div class="tools">
        <div class="lang" id="login-lang"></div>
        <div id="login-theme"></div>
      </div>
      <span id="login-logo"></span>
      <p class="eyebrow" id="login-kicker"></p>
      <h1 id="login-title" class="wordmark"></h1>
      <p id="login-help"></p>
      <input name="token" type="password" autocomplete="current-password" required />
      <button type="submit" id="login-submit"></button>
      <p id="login-error"></p>
    </form>
    <main id="app" hidden>
      <header>
        <div class="brand">
          <span id="logo"></span>
          <div>
            <h1 id="title" class="wordmark"></h1>
            <p id="creator"></p>
            <p id="intro"></p>
            <p id="privacy"></p>
            <p id="updated"></p>
          </div>
        </div>
        <div class="header-side">
          <div class="tools">
            <div class="lang" id="lang"></div>
            <div id="theme"></div>
          </div>
          <p id="recorder"></p>
        </div>
      </header>
      <section id="stack"></section>
      <section id="plan"></section>
      <section id="legend"></section>
      <section id="cards"></section>
      <section class="split">
        <div class="panel">
          <h2 id="chart-title"></h2>
          <div id="chart"></div>
        </div>
        <div class="panel">
          <h2 id="feed-title"></h2>
          <p id="feed-help"></p>
          <ol id="feed"></ol>
        </div>
      </section>
      <section id="breakdowns"></section>
      <section id="organizations"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
