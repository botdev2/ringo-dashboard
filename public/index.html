<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ringo Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <form id="login" hidden>
      <h1>Ringo Dashboard</h1>
      <p>Enter the dashboard token.</p>
      <input name="token" type="password" autocomplete="current-password" required />
      <button type="submit">Open</button>
      <p id="login-error"></p>
    </form>
    <main id="app" hidden>
      <header>
        <div>
          <h1>Ringo Dashboard</h1>
          <p id="updated">Waiting for the backends.</p>
        </div>
        <p id="recorder"></p>
      </header>
      <section id="cards"></section>
      <section class="split">
        <div>
          <h2>Calls, last 14 days</h2>
          <div id="chart"></div>
        </div>
        <div>
          <h2>Recorded since this process started</h2>
          <ol id="feed"></ol>
        </div>
      </section>
      <section id="breakdowns"></section>
      <section id="organizations"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
