<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ringo Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <form id="login" hidden>
      <div class="lang" id="login-lang"></div>
      <p class="eyebrow" id="login-kicker"></p>
      <h1 id="login-title"></h1>
      <p id="login-help"></p>
      <input name="token" type="password" autocomplete="current-password" required />
      <button type="submit" id="login-submit"></button>
      <p id="login-error"></p>
    </form>
    <main id="app" hidden>
      <header>
        <div>
          <p class="eyebrow">Ringo</p>
          <h1 id="title"></h1>
          <p id="intro"></p>
          <p id="privacy"></p>
          <p id="updated"></p>
        </div>
        <div class="header-side">
          <div class="lang" id="lang"></div>
          <p id="recorder"></p>
        </div>
      </header>
      <section id="stack"></section>
      <section id="cards"></section>
      <section class="split">
        <div class="panel">
          <h2 id="chart-title"></h2>
          <div id="chart"></div>
        </div>
        <div class="panel">
          <h2 id="feed-title"></h2>
          <p id="feed-help"></p>
          <ol id="feed"></ol>
        </div>
      </section>
      <section id="breakdowns"></section>
      <section id="organizations"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
